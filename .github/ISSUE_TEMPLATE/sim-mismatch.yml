name: 시뮬레이션이 실제와 다름
description: 가상 터미널 출력이나 채점 결과가 실제 Kubernetes 동작과 다를 때
labels: [simulation]
body:
  - type: markdown
    attributes:
      value: |
        실제 시험 문제, kubeconfig, 토큰, 인증서, 회사 클러스터 정보는 붙이지 마세요.
  - type: textarea
    id: command
    attributes:
      label: 입력한 명령이나 YAML
      render: shell
    validations:
      required: true
  - type: textarea
    id: simulated
    attributes:
      label: 가상 출력 또는 채점 결과
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 실제 출력 또는 기대한 결과
      description: 실제 클러스터에서 확인한 출력이나 공식 문서 링크를 적어 주세요.
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: 확인한 Kubernetes 버전
      placeholder: v1.34
  - type: input
    id: plugin-version
    attributes:
      label: 플러그인 버전과 모델
      placeholder: 0.1.0, Sonnet
